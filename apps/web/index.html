<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Pokeguarde · Biblioteca de partidas</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/shell.css">
  <!-- OC-STITCH-08 — páginas integradas del catálogo Stitch (bundle aislado). -->
  <link rel="stylesheet" href="/assets/pg08/workbenches.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <h1 data-i18n="app.brand">Pokeguarde</h1>
      <span class="tag" data-i18n="app.tagline">Biblioteca de partidas</span>
    </div>
    <nav class="nav">
      <button id="nav-library" class="ghost active" data-i18n="nav.library">Biblioteca</button>
      <button id="nav-sheet" class="ghost" data-i18n="nav.sheet">Ficha / Datos</button>
      <button id="nav-nursery" class="ghost" data-i18n="nav.nursery">Guardería</button>
    </nav>
    <button id="pg-switcher" class="ghost pg-switcher-trigger" data-i18n="nav.switcher" aria-keyshortcuts="Control+K Meta+K">Buscador</button>
    <div id="health" class="health" data-i18n="health.checking">comprobando…</div>
  </header>

  <!-- OC-STITCH-08 — un único landmark principal para todas las vistas. -->
  <main id="pg-main">
  <section id="pg-home" class="pg-view" aria-label="Inicio"></section>

  <div class="layout">
    <aside class="panel saves">
      <div class="panel-head">
        <h2 data-i18n="saves.heading">Partidas</h2>
        <button id="refresh" class="ghost" data-i18n-title="saves.refresh" title="Recargar">↻</button>
      </div>
      <div id="drop" class="drop">
        <strong data-i18n="drop.title">Arrastra un save</strong>
        <span data-i18n="drop.hint">.srm · .sav · .dsv (32 KB – 512 KB)</span>
        <label class="pick"><span data-i18n="drop.pick">o elige un archivo</span><input id="file" type="file" accept=".srm,.sav,.dsv,.bin" hidden></label>
      </div>
      <ul id="saves" class="save-list"></ul>
      <p id="status" class="status"></p>
    </aside>

    <section id="detail" class="panel detail empty">
      <p class="placeholder" data-i18n="detail.placeholder">Selecciona una partida para ver el inventario.</p>
    </section>
  </div>

  <section id="nursery" class="panel nursery hidden"></section>

  <section id="sheet" class="panel dossier hidden" aria-live="polite"></section>

  <section id="pg-stub" class="pg-view hidden" aria-live="polite"></section>
  </main>

  <dialog id="mon">
    <form method="dialog"><button class="close" data-i18n-aria="dialog.close" aria-label="Cerrar">×</button></form>
    <div id="mon-body"></div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
